<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Ready - Secure Download</title>

    <!-- Monetag Popunder (Zone: 11932535) -->

    <!-- Monetag In-Page Push (Zone: 11932538) -->
    <script>(function(s){s.dataset.zone='11932538',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100vh; margin: 0;
        }
        .container {
            text-align: center; background: #1e1e1e; padding: 40px;
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 400px; width: 90%;
        }
        h1 { color: #4CAF50; font-size: 24px; }
        p { color: #b3b3b3; font-size: 14px; margin-bottom: 30px; }
        .btn {
            background: #0088cc; color: white; padding: 15px 30px;
            text-decoration: none; border-radius: 8px; font-size: 18px;
            font-weight: bold; display: inline-block; cursor: pointer;
            width: 100%; border: none; transition: 0.3s;
        }
        .btn:hover { background: #0077b3; }
    </style>
</head>
<body>

<div class="container">
    <h1>📥 File is Ready!</h1>
    <p>Click the button below to open your file securely in Telegram.</p>
    <p style="font-size: 11px; color: #888; margin-top: -15px; margin-bottom: 25px;">
        <i>💡 Note: If an ad opens in a new tab, just click back and click the button again.</i>
    </p>
    <button class="btn" id="downloadBtn">Open in Telegram</button>
</div>


    <script>
        // URL read karne ka smart tareeqa (Redirects aur Hash dono handle karega)
        let searchString = window.location.search;
        if (!searchString && window.location.hash.includes('?')) {
            searchString = window.location.hash.substring(window.location.hash.indexOf('?'));
        }
        
        const urlParams = new URLSearchParams(searchString);
        const startParam = urlParams.get('start');
        // Agar URL mein bot name cut ho jaye, toh default tumhare bot ka username use karega
        const botName = urlParams.get('bot') || "GoogleBookxSearchBot"; 

        if (!startParam) {
            // Error ke sath actual URL bhi dikhayega taaki debugging aasan ho
            document.querySelector('.container').innerHTML = `<h1>⚠️ Invalid Link</h1><p>Missing Data. Please search again in Telegram.</p><p style="font-size:10px; color:#555;">Debug: ${window.location.href}</p>`;
        } else {
            const tgLink = `tg://resolve?domain=${botName}&start=${startParam}`;

            document.getElementById('downloadBtn').addEventListener('click', function() {
                window.location.href = tgLink;
            });
        }
    </script>


</body>
</html>
